name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle

      - name: Install SemVer CLI
        run: npm install --global semver

      - name: Resolve project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(
            sed -nE 's/^version = "([^"]+)"$/\1/p' build.gradle.kts
          )"
          if [[ -z "$VERSION" ]]; then
            echo "::error::build.gradle.kts must contain a hard-coded version assignment."
            exit 1
          fi
          if [[ -z "$(semver "$VERSION")" ]]; then
            echo "::error::Invalid project SemVer: $VERSION"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        if: github.event_name == 'push'
        env:
          PROJECT_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "v$PROJECT_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version v$PROJECT_VERSION."
            exit 1
          fi

      - name: Build and test
        run: ./gradlew --no-daemon --console=plain build

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon --console=plain publishMavenJavaPublicationToGitHubPackagesRepository
