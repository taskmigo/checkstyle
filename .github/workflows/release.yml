name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle

      - name: Install SemVer CLI
        run: npm install --global semver

      - name: Resolve project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(
            sed -nE 's/^version = "([^"]+)"$/\1/p' build.gradle.kts
          )"
          if [[ -z "$VERSION" ]]; then
            echo "::error::build.gradle.kts must contain a hard-coded version assignment."
            exit 1
          fi
          if [[ -z "$(semver "$VERSION")" ]]; then
            echo "::error::Invalid project SemVer: $VERSION"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release ref
        env:
          PROJECT_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/next" ]]; then
            echo "::error::Manual releases must be dispatched from the next branch."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "v$PROJECT_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version v$PROJECT_VERSION."
            exit 1
          fi

      - name: Build and test
        run: ./gradlew --no-daemon --console=plain build

      - name: Validate Maven Central credentials
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in             ORG_GRADLE_PROJECT_mavenCentralUsername             ORG_GRADLE_PROJECT_mavenCentralPassword             ORG_GRADLE_PROJECT_signingInMemoryKey; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required release secret for $name."
              exit 1
            fi
          done

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --console=plain publishAndReleaseToMavenCentral
