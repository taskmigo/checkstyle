name: Build

on:
  pull_request:
    branches:
      - next
  push:
    branches:
      - next

permissions:
  contents: read

jobs:
  version:
    name: Require SemVer increment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Extract base build file
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git show "$BASE_SHA:build.gradle.kts" > "$RUNNER_TEMP/base-build.gradle.kts"

      - name: Verify version increment
        run: python scripts/check_version.py "$RUNNER_TEMP/base-build.gradle.kts" build.gradle.kts

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle

      - name: Build and test
        run: ./gradlew --no-daemon --console=plain build publishToMavenLocal
