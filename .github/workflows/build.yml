name: Build

on:
  pull_request:
    branches:
      - next
  push:
    branches:
      - next

permissions:
  contents: read

jobs:
  version:
    name: Require SemVer increment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify version increment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: python
        run: |
          import os
          import re
          import subprocess
          import sys

          SEMVER_PATTERN = (
              r'(?:0|[1-9]\d*)\.'
              r'(?:0|[1-9]\d*)\.'
              r'(?:0|[1-9]\d*)'
              r'(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?'
              r'(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?'
          )
          ASSIGNMENT = re.compile(
              rf'^version\s*=\s*"(?P<version>{SEMVER_PATTERN})"\s*
          SEMVER = re.compile(
              r'^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)'
              r'(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?'
              r'(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?

          def head_version(text):
              match = ASSIGNMENT.search(text)
              if match is None:
                  print(
                      '::error::PR build.gradle.kts must contain a hard-coded SemVer '
                      'assignment like version = "0.1.0"'
                  )
                  sys.exit(1)
              return match.group("version")

          def base_version(text):
              match = ASSIGNMENT.search(text)
              if match is not None:
                  return match.group("version")

              # Bootstrap compatibility for the one base revision that predates
              # the hard-coded version policy. Future next revisions use ASSIGNMENT.
              legacy = LEGACY_ASSIGNMENT.search(text)
              if legacy is not None:
                  return legacy.group("version")

              print("::error::Base build.gradle.kts does not declare a recognizable SemVer")
              sys.exit(1)

          def prerelease_key(value):
              if value is None:
                  return (1, ())
              parts = []
              for item in value.split("."):
                  if item.isdigit():
                      parts.append((0, int(item)))
                  else:
                      parts.append((1, item))
              return (0, tuple(parts))

          def semver_key(value):
              match = SEMVER.fullmatch(value)
              if match is None:
                  print(f"::error::Invalid SemVer: {value}")
                  sys.exit(1)
              major, minor, patch, prerelease = match.groups()
              return (int(major), int(minor), int(patch), prerelease_key(prerelease))

          with open("build.gradle.kts", encoding="utf-8") as current_file:
              current = head_version(current_file.read())

          base_text = subprocess.check_output(
              ["git", "show", f"{os.environ['BASE_SHA']}:build.gradle.kts"],
              text=True,
          )
          base = base_version(base_text)

          if semver_key(current) <= semver_key(base):
              print(
                  "::error::Version must increase for every PR merged to next: "
                  f"base={base}, head={current}"
              )
              sys.exit(1)

          print(f"Version increment is valid: {base} -> {current}")

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle

      - name: Build and test
        run: ./gradlew --no-daemon --console=plain build publishToMavenLocal
